name: Construire MUTOPI (APK + EXE)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Clé de signature
        env: { KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mutopi.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/mutopi.jks" >> "$GITHUB_ENV"
          fi
      - name: Construire l'APK
        env:
          KEYSTORE_PASSWORD: '${{ secrets.KEYSTORE_PASSWORD }}'
          VERSION_CODE: '${{ github.run_number }}'
        run: gradle -p android assembleRelease --no-daemon
      - name: Renommer
        run: |
          V=$(python3 -c "import json;print(json.load(open('config.json'))['version'])")
          mkdir -p sortie && cp android/app/build/outputs/apk/release/app-release.apk "sortie/MUTOPI-Pharmacie-$V.apk"
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: sortie/*.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Construire l'EXE
        working-directory: windows
        shell: bash
        run: |
          cp ../config.json config.json
          npm install --no-audit --no-fund
          npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: windows/dist/*.exe }

  publier:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: fichiers, merge-multiple: true }
      - name: Publier sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: MUTOPI Pharmacie ${{ github.ref_type == 'tag' && github.ref_name || format('(build {0})', github.run_number) }}
          body: |
            **MUTOPI Pharmacie** — une solution Vsanté by Vsoft
            Conception et développement : Ing. Volonté MAYITUKA · +243 994 942 076

            - **Android** : `MUTOPI-Pharmacie-*.apk` (autoriser « sources inconnues » à l'installation)
            - **Windows** : `MUTOPI-Pharmacie-Installation-*.exe` (installation) ou `MUTOPI-Pharmacie-Portable-*.exe` (sans installation)
          files: fichiers/*
